<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Áudio</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        button { padding: 20px 40px; font-size: 20px; margin: 20px; cursor: pointer; background: #0d6efd; color: white; border: none; border-radius: 10px; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
    </style>
</head>
<body>
    <h1>Página de Teste de Áudios</h1>
    <p>Se não tocar aqui, o arquivo mp3 pode estar corrompido.</p>
    
    <button class="btn-green" onclick="document.getElementById('audio-caixa').play()">💵 Testar Caixa Registradora</button>
    <button class="btn-red" onclick="testarSirene15s()">🚨 Testar Sirene de Polícia (15s)</button>
    <button style="background: #37474f;" onclick="testarDistribuicao()">⚡ Testar Distribuição (Black Sabbath)</button>
    <button style="background: #e65100;" onclick="testarVarejoReg()">🎧 Testar Varejo Reg (David Guetta - 31s)</button>
    <button style="background: #6a1b9a;" onclick="testarEmpresa()">🎸 Testar Empresa (Van Halen - Jump)</button>

    <h3>Controles Diretos</h3>
    <p>Distribuição (Black Sabbath):</p>
    <audio id="audio-distribuicao" src="/static/audio/black_sabbath.mp3?v=1" controls style="display:block; margin: 10px auto;"></audio>
    <p>Sirene de Polícia (15s):</p>
    <audio id="audio-policia" src="/static/audio/sirene_policia.mp3?v=4" controls style="display:block; margin: 10px auto;"></audio>
    <p>Varejo Reg (David Guetta, Hypaton & Europe):</p>
    <audio id="audio-varejo-reg" src="/static/audio/david_guetta_europe.mp3?v=1" controls style="display:block; margin: 10px auto;"></audio>
    <p>Empresa (Van Halen - Jump):</p>
    <audio id="audio-empresa" src="/static/audio/van_halen_jump.mp3" controls style="display:block; margin: 10px auto;"></audio>
    <p>Caixa Registradora:</p>
    <audio id="audio-caixa" src="/static/audio/caixa_registradora.mp3" controls style="display:block; margin: 10px auto;"></audio>

    <script>
        function testarDistribuicao() {
            const a = document.getElementById('audio-distribuicao');
            a.currentTime = 0;
            a.play();
        }
        function testarVarejoReg() {
            const a = document.getElementById('audio-varejo-reg');
            a.currentTime = 0;
            a.play();
            setTimeout(() => {
                a.pause();
                a.currentTime = 0;
            }, 31000); // 31 segundos
        }
        function testarEmpresa() {
            const a = document.getElementById('audio-empresa');
            a.currentTime = 0;
            a.play();
            setTimeout(() => {
                a.pause();
                a.currentTime = 0;
            }, 28000);
        }
        function testarSirene15s() {
            const a = document.getElementById('audio-policia');
            a.currentTime = 0;
            a.loop = true;
            a.play();
            setTimeout(() => {
                a.loop = false;
                a.pause();
                a.currentTime = 0;
            }, 15000);
        }
    </script>

</body>
</html>
