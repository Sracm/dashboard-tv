<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Performance da Empresa</title>
    
    <!-- Google Fonts: Montserrat (MQ Design System) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/empresa.css') }}?v=2">
    
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="nav-tabs-container">
                    <button onclick="navigateTab('/tv')" class="tab-btn">Mensal(%)</button>
                    <button onclick="navigateTab('/acumulado')" class="tab-btn">Acumulado(%)</button>
                    <button onclick="navigateTab('/trimestre')" class="tab-btn">Trimestre</button>
                    <button onclick="navigateTab('/todos_canais')" class="tab-btn">Todos os Canais</button>
                    <button onclick="navigateTab('/categorias')" class="tab-btn">Categorias</button>
                    <button onclick="navigateTab('/marcas')" class="tab-btn">Marcas</button>
                    <button onclick="navigateTab('/empresa')" class="tab-btn active">Empresa</button>
                    <button onclick="navigateTab('/diario_canal')" class="tab-btn">Diário Canal</button>
                    <button onclick="navigateTab('/diario_marcas')" class="tab-btn">Diário Marcas</button>
                    <button onclick="navigateTab('/paises')" class="tab-btn">Países</button>
                </div>
                <div class="header-title-main">INDICADORES DE PERFORMANCE</div>
            </div>

            <div class="header-bottom">
                <div class="filters-row">
                    <div class="multiselect-wrapper" id="month-multiselect">
                        <button type="button" class="multiselect-btn" id="month-select-btn" onclick="toggleMonthDropdown(event)">
                            <span class="ms-icon">📅</span>
                            <span id="month-select-label">Meses: Jan a Ago (8)</span>
                            <span class="ms-arrow">▼</span>
                        </button>
                        <div class="multiselect-menu" id="month-select-menu">
                            <div class="ms-header">
                                <div class="ms-title-row">
                                    <span class="ms-title">Filtrar Meses</span>
                                    <span class="ms-selected-count" id="ms-count-badge">8 sel.</span>
                                </div>
                                <div class="ms-quick-actions">
                                    <button type="button" class="ms-action-btn" onclick="selectAllMonths(true, event)">Todos</button>
                                    <button type="button" class="ms-action-btn" onclick="selectLastNMonths(3, event)">Últ. 3</button>
                                    <button type="button" class="ms-action-btn" onclick="selectLastNMonths(6, event)">Últ. 6</button>
                                    <button type="button" class="ms-action-btn" onclick="selectAllMonths(false, event)">Limpar</button>
                                </div>
                            </div>
                            <div class="ms-grid" id="month-checkbox-grid">
                                <!-- Checkboxes gerados dinamicamente -->
                            </div>
                        </div>
                        <input type="hidden" id="filter-month" value="8">
                    </div>
                    <select id="filter-year" onchange="fetchData()">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                    <button id="btn-refresh" onclick="manualRefresh()" class="btn-refresh" title="Atualizar dados agora">🔄 Atualizar</button>
                    <button onclick="testarAudio('empresa')" class="btn-sirene" style="background:#ffc107; color:#000;" title="Tocar Van Halen - Jump (28s)">⚡ Van Halen (28s)</button>
                    <button onclick="pararTodosAudios()" class="btn-sirene" style="background:#dc3545; color:#fff;" title="Parar música">⏹ Parar</button>
                </div>
                <div class="header-meta-info">
                    <div class="clock" id="clock">00:00:00</div>
                    <div class="date" id="date">01/01/2026</div>
                    <div class="last-update" id="last-update">Última atualização: --:--:--</div>
                    <div class="next-update" id="next-update">Próxima atualização em: 10:00</div>
                </div>
            </div>
        </header>

        <!-- Sub-navegação interna de Empresa -->
        <div class="sub-nav-empresa">
            <button id="btn-view-mes" class="tab-btn active" style="padding: 5px 18px;" onclick="setEmpresaView('mes')">MÊS ATUAL</button>
            <button id="btn-view-acumulado" class="tab-btn" style="padding: 5px 18px;" onclick="setEmpresaView('acumulado')">ACUMULADO (PERÍODO)</button>
        </div>

        <!-- Main Container para o Velocímetro Gigante -->
        <main class="empresa-main-container">
            <div class="empresa-card-wrapper">
                <div id="meta-banner-el" class="meta-banner">🎉 META ATINGIDA 🎉</div>
                <div class="empresa-card" id="empresa-card-el">
                    <div class="empresa-title" id="empresa-card-title">EMPRESA (MÊS ATUAL)</div>
                    <div class="empresa-chart" id="empresa-gauge"></div>
                    <div class="comparison-container empresa-comparisons" id="empresa-comparisons"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Áudios de Vitória / Meta -->
    <audio id="victory-sound" src="/static/audio/aim_drive.mp3" preload="none"></audio>
    <audio id="music-sound" src="/static/audio/van_halen_jump.mp3" preload="none"></audio>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/empresa.js') }}?v=12"></script>
</body>
</html>
