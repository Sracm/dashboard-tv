<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Performance Trimestral e Semestral</title>
    
    <!-- Google Fonts: Montserrat (MQ Design System) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=5">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/trimestre.css') }}?v=2">
    
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="nav-tabs-container">
                    <button onclick="navigateTab('/tv')" class="tab-btn">Mensal(%)</button>
                    <button onclick="navigateTab('/acumulado')" class="tab-btn">Acumulado(%)</button>
                    <button onclick="navigateTab('/trimestre')" class="tab-btn active">Trimestre</button>
                    <button onclick="navigateTab('/todos_canais')" class="tab-btn">Todos os Canais</button>
                    <button onclick="navigateTab('/categorias')" class="tab-btn">Categorias</button>
                    <button onclick="navigateTab('/marcas')" class="tab-btn">Marcas</button>
                    <button onclick="navigateTab('/canais_vendas')" class="tab-btn">Canais de Vendas</button>
                    <button onclick="navigateTab('/empresa')" class="tab-btn">Empresa</button>
                    <button onclick="navigateTab('/diario_canal')" class="tab-btn">Diário Canal</button>
                    <button onclick="navigateTab('/diario_marcas')" class="tab-btn">Diário Marcas</button>
                    <button onclick="navigateTab('/paises')" class="tab-btn">Países</button>
                </div>
                <div class="header-title-main">INDICADORES DE PERFORMANCE</div>
            </div>

            <div class="header-bottom">
                <div class="filters-row">
                    <input type="hidden" id="filter-month" value="12">
                    <select id="filter-year" onchange="fetchData()">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                    <button id="btn-refresh" onclick="manualRefresh()" class="btn-refresh" title="Atualizar dados agora">🔄 Atualizar</button>
                </div>
                <div class="header-meta-info">
                    <div class="clock" id="clock">00:00:00</div>
                    <div class="date" id="date">01/01/2026</div>
                    <div class="last-update" id="last-update">Última atualização: --:--:--</div>
                    <div class="next-update" id="next-update">Próxima atualização em: 10:00</div>
                </div>
            </div>
        </header>

        <!-- Main Grid for 5 Gauges -->
        <main class="grid-container-trimestre" id="trimestre-container">
            <!-- 1º Trimestre -->
            <div class="trimestre-card">
                <div class="trimestre-title" id="title-0">EMPRESA (1º TRIMESTRE)</div>
                <div class="trimestre-chart" id="gauge-0"></div>
            </div>

            <!-- 2º Trimestre -->
            <div class="trimestre-card">
                <div class="trimestre-title" id="title-1">EMPRESA (2º TRIMESTRE)</div>
                <div class="trimestre-chart" id="gauge-1"></div>
            </div>

            <!-- 3º Trimestre -->
            <div class="trimestre-card">
                <div class="trimestre-title" id="title-2">EMPRESA (3º TRIMESTRE)</div>
                <div class="trimestre-chart" id="gauge-2"></div>
            </div>

            <!-- Mês Atual -->
            <div class="trimestre-card">
                <div class="trimestre-title" id="title-3">EMPRESA (MES ATUAL)</div>
                <div class="trimestre-chart" id="gauge-3"></div>
            </div>

            <!-- Empresa Acumulado / Semestre -->
            <div class="trimestre-card">
                <div class="trimestre-title" id="title-4">EMPRESA</div>
                <div class="trimestre-chart" id="gauge-4"></div>
            </div>
        </main>
    </div>

    <!-- Áudio de Vitória / Meta -->
    <audio id="victory-sound" src="/static/audio/aim_drive.mp3" preload="none"></audio>
    <audio id="music-sound" src="/static/audio/audio-musica.mp3" preload="none"></audio>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/trimestre.js') }}?v=5"></script>
</body>
</html>
