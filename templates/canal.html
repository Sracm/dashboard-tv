<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Canal {{ canal_db }}</title>
    
    <!-- Google Fonts: Montserrat (MQ Design System) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=14">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/categorias.css') }}?v=20261002_102000">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header Unificado -->
        <header class="header">
            <div class="header-top">
                <div class="nav-tabs-container">
                    <button onclick="navigateTab('/tv')" class="tab-btn">Mensal(%)</button>
                    <button onclick="navigateTab('/acumulado')" class="tab-btn">Acumulado(%)</button>
                    <button onclick="navigateTab('/trimestre')" class="tab-btn">Trimestre</button>
                    <button onclick="navigateTab('/todos_canais')" class="tab-btn">Todos os Canais</button>
                    <button onclick="navigateTab('/categorias')" class="tab-btn">Categorias</button>
                    <button onclick="navigateTab('/marcas')" class="tab-btn">Marcas</button>
                    <button onclick="navigateTab('/canal/distribuicao')" class="tab-btn {{ 'active' if canal_id == 'distribuicao' else '' }}">Distribuição</button>
                    <button onclick="navigateTab('/canal/ecommerce_mq')" class="tab-btn {{ 'active' if canal_id == 'ecommerce_mq' else '' }}">E-commerce MQ</button>
                    <button onclick="navigateTab('/canal/varejo_sp')" class="tab-btn {{ 'active' if canal_id == 'varejo_sp' else '' }}">Varejo SP</button>
                    <button onclick="navigateTab('/canal/comex')" class="tab-btn {{ 'active' if canal_id == 'comex' else '' }}">Comex</button>
                    <button onclick="navigateTab('/canal/regional_no_nd')" class="tab-btn {{ 'active' if canal_id == 'regional_no_nd' else '' }}">Regional NO/ND</button>
                    <button onclick="navigateTab('/canal/regional_rj_mg_es')" class="tab-btn {{ 'active' if canal_id == 'regional_rj_mg_es' else '' }}">Reg. RJ/MG/ES</button>
                    <button onclick="navigateTab('/canal/regional_sul')" class="tab-btn {{ 'active' if canal_id == 'regional_sul' else '' }}">Regional Sul</button>
                    <button onclick="navigateTab('/empresa')" class="tab-btn">Empresa</button>
                    <button onclick="navigateTab('/diario_canal')" class="tab-btn">Diário Canal</button>
                    <button onclick="navigateTab('/diario_marcas')" class="tab-btn">Diário Marcas</button>
                    <button onclick="navigateTab('/paises')" class="tab-btn">Países</button>
                    <button onclick="navigateTab('/teste_estoque')" class="tab-btn"><span class="tab-icon">🚨</span> Estoque e Previsão</button>
                </div>
            </div>

            <div class="header-bottom">
                <div class="filters-row">
                    <select id="filter-month" onchange="fetchData()" title="A tabela consolida de 01/01 até o fim do mês escolhido (ou até hoje, se for o mês corrente)">
                        <option value="1">Acumulado até Janeiro</option>
                        <option value="2">Acumulado até Fevereiro</option>
                        <option value="3">Acumulado até Março</option>
                        <option value="4">Acumulado até Abril</option>
                        <option value="5">Acumulado até Maio</option>
                        <option value="6">Acumulado até Junho</option>
                        <option value="7">Acumulado até Julho</option>
                        <option value="8">Acumulado até Agosto</option>
                        <option value="9">Acumulado até Setembro</option>
                        <option value="10">Acumulado até Outubro</option>
                        <option value="11">Acumulado até Novembro</option>
                        <option value="12">Acumulado até Dezembro</option>
                    </select>
                    <select id="filter-year" onchange="fetchData()">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>

                    <!-- Filtro Multiselect de Marcas -->
                    <div class="multiselect-wrapper" id="marca-multiselect">
                        <button type="button" class="multiselect-btn" id="marca-select-btn" onclick="toggleMarcaDropdown(event)" title="Filtrar marcas exibidas no painel">
                            <span class="ms-icon">🏷️</span>
                            <span id="marca-select-label">Marcas: Todas</span>
                            <span class="ms-arrow">▼</span>
                        </button>
                        <div class="multiselect-menu" id="marca-select-menu" style="width: 260px;">
                            <div class="ms-header">
                                <div class="ms-title-row">
                                    <span class="ms-title">Filtrar Marcas</span>
                                    <span class="ms-selected-count" id="marca-count-badge">-- sel.</span>
                                </div>
                                <div class="ms-quick-actions">
                                    <button type="button" class="ms-action-btn" onclick="selectAllMarcas(true, event)">Todas</button>
                                    <button type="button" class="ms-action-btn" onclick="selectAllMarcas(false, event)">Limpar</button>
                                </div>
                            </div>
                            <div class="ms-grid" id="marca-checkbox-grid" style="grid-template-columns: 1fr; max-height: 260px; overflow-y: auto; gap: 4px;">
                                <!-- Checkboxes gerados dinamicamente via JS -->
                            </div>
                        </div>
                    </div>

                    <!-- Filtro Multiselect de Categorias -->
                    <div class="multiselect-wrapper" id="cat-multiselect">
                        <button type="button" class="multiselect-btn" id="cat-select-btn" onclick="toggleCatDropdown(event)" title="Filtrar categorias exibidas na tabela">
                            <span class="ms-icon">📦</span>
                            <span id="cat-select-label">Categorias: Principais</span>
                            <span class="ms-arrow">▼</span>
                        </button>
                        <div class="multiselect-menu" id="cat-select-menu" style="width: 320px;">
                            <div class="ms-header">
                                <div class="ms-title-row">
                                    <span class="ms-title">Filtrar Categorias</span>
                                    <span class="ms-selected-count" id="cat-count-badge">-- sel.</span>
                                </div>
                                <div class="ms-quick-actions">
                                    <button type="button" class="ms-action-btn" onclick="selectDefaultCategories(event)">Padrão</button>
                                    <button type="button" class="ms-action-btn" onclick="selectAllCategories(true, event)">Todas</button>
                                    <button type="button" class="ms-action-btn" onclick="selectAllCategories(false, event)">Limpar</button>
                                </div>
                            </div>
                            <div class="ms-grid" id="cat-checkbox-grid" style="grid-template-columns: 1fr; max-height: 280px; overflow-y: auto; gap: 4px;">
                                <!-- Checkboxes gerados dinamicamente via JS -->
                            </div>
                        </div>
                    </div>

                    <button id="btn-refresh" onclick="manualRefresh()" class="btn-refresh" title="Atualizar dados agora">🔄 Atualizar</button>
                </div>
                <div class="header-meta-info">
                    <div class="clock" id="clock">00:00:00</div>
                    <div class="date" id="date">01/01/2026</div>
                    <div class="last-update" id="last-update">Última atualização: --:--:--</div>
                    <div class="next-update" id="next-update">Próxima atualização em: 10:00</div>
                </div>
            </div>
        </header>

        <!-- View Controls & Filters -->
        <section class="controls-bar">
            <div class="controls-left-group">
                <div class="view-switch-container">
                    <button class="view-btn active" id="btn-mode-cards" onclick="switchViewMode('cards')" title="Visualização em Colunas Lado a Lado">
                        📊 Colunas Lado a Lado
                    </button>
                    <button class="view-btn" id="btn-mode-table" onclick="switchViewMode('table')" title="Visualização em Tabela Detalhada com Hierarquia">
                        📋 Tabela Detalhada
                    </button>
                </div>

                <div class="metric-switch-container" id="table-tree-controls" style="display: none;">
                    <button class="tree-toggle-btn" onclick="expandAllCategories()" title="Expandir todos os produtos">▾ Expandir Todos</button>
                    <button class="tree-toggle-btn" onclick="collapseAllCategories()" title="Recolher e ver apenas categorias">▸ Recolher Todos</button>
                </div>
            </div>

            <div class="search-and-stats">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="table-search" placeholder="Filtrar categoria ou produto no canal..." onkeyup="filterTable()">
                </div>
            </div>
        </section>

        <!-- Mode 1: Colunas Lado a Lado (Padrão) -->
        <main class="columns-grid-container" id="container-cards">
            <div style="grid-column: 1 / -1; display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; color:var(--gold); font-size:1rem; gap:12px;">
                <span style="font-size:2rem;">⏳</span>
                <span style="font-weight:600; letter-spacing:0.5px;">Carregando dados do canal {{ canal_db }}...</span>
            </div>
        </main>

        <!-- Mode 2: Executive Data Table Container -->
        <main class="table-card-container" id="container-table" style="display: none;">
            <div class="table-responsive-wrapper">
                <table class="exec-table" id="table-categorias">
                    <thead>
                        <tr id="table-header-row">
                            <!-- Cabeçalhos gerados via JS -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="6" style="text-align:center; padding:40px; color:var(--gold); font-size:0.9rem;">
                                ⏳ Carregando tabela do canal {{ canal_db }}...
                            </td>
                        </tr>
                    </tbody>
                    <tfoot id="table-footer">
                        <!-- Linha de totais gerada dinamicamente via JS -->
                    </tfoot>
                </table>
            </div>
        </main>
    </div>

    <!-- Áudio de Comemoração da Meta -->
    <audio id="victory-sound" src="/static/audio/aim_drive.mp3" preload="none"></audio>
    <audio id="music-sound" src="/static/audio/audio-musica.mp3" preload="none"></audio>

    <!-- Contexto do Canal no JS -->
    <script>
        window.CURRENT_CANAL = {{ canal_db|tojson }};
        window.CURRENT_CANAL_ID = {{ canal_id|tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/canal.js') }}?v=20261002_SCROLL"></script>
    <!-- Auto-Rotacao TV (Carrossel Continuo 2.5 min) -->
    <script src="{{ url_for('static', filename='js/tv_rotator.js') }}?v=2"></script>
</body>
</html>
